# fly.toml app configuration file for Snowglobe backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'snowglobe-backend'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# only 1 machine since there's no concept of shared memory built in right now
# if you need more scaling, you'll have to handle
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
