# Example Fly.io deployment workflow
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# To enable: uncomment the `on:` trigger below and add these secrets to your repo:
#   - FLY_API_TOKEN (for frontend)
#   - FLY_BACKEND_API_TOKEN (for backend)

name: Fly Deploy

# Uncomment to enable auto-deploy on push to main:
# on:
#   push:
#     branches:
#       - main

on: workflow_dispatch  # Manual trigger only

jobs:
  deploy-frontend:
    name: Deploy SvelteKit frontend
    runs-on: ubuntu-latest
    concurrency: deploy-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-backend:
    name: Deploy Gleam backend
    runs-on: ubuntu-latest
    concurrency: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKEND_API_TOKEN }}
